name: Prepare Windows release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag matching CMakeLists.txt (for example v0.4.8)
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(IxView VERSION ([0-9.]+)').Groups[1].Value
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag must match project version' }
          $tagCommit = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Existing tag required' }
          if ($tagCommit -ne (git rev-parse HEAD)) { throw 'Tag and checkout differ' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/cache@v4
        with:
          path: .deps/cache
          key: windows-sdk-${{ hashFiles('scripts/sdk-lock.json') }}
      - name: Build, test and prepare Windows assets
        shell: pwsh
        run: ./scripts/prepare_release.ps1 -BootstrapSDK
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-candidate
          path: |
            dist/uxzView-win64.zip
            dist/uxzView-source.zip
            dist/SOURCES.md
            dist/dependency-sources.json
            dist/SHA256SUMS.txt
            dist/release-notes.md
            dist/tools/*.ixtool
            dist/tools/uxzView-tools.json
            dist/tools/uxzView-tools-SHA256SUMS.txt
          if-no-files-found: error
      - name: Create draft with Windows binary and source assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @('dist/uxzView-win64.zip', 'dist/uxzView-source.zip', 'dist/SOURCES.md', 'dist/dependency-sources.json', 'dist/SHA256SUMS.txt')
          $assets += @(Get-ChildItem -LiteralPath dist/tools -File | Where-Object { $_.Extension -eq '.ixtool' -or $_.Name -in @('uxzView-tools.json', 'uxzView-tools-SHA256SUMS.txt') } | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "üxzView $env:RELEASE_TAG" --notes-file dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
